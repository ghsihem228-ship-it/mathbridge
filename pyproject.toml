[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathbridge"
version = "0.1.0"
description = "A unified layer over NumPy/SciPy/SymPy for functional analysis and Fourier series, with step-by-step explanations and ready-made plots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/mathbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
